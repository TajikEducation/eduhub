name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

defaults:
  run:
    working-directory: web

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: eduhub
          POSTGRES_PASSWORD: eduhub
          POSTGRES_DB: eduhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduhub -d eduhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: backend

      - run: go test -race ./...

      - name: Применить миграции (00001-00005) к тестовой БД
        run: go tool goose -dir migrations postgres "$DATABASE_URL" up
        env:
          DATABASE_URL: postgres://eduhub:eduhub@localhost:5432/eduhub_test?sslmode=disable

      # -p 1: несколько пакетов интеграционных тестов делят одну TEST_DATABASE_URL, а
      # cmd/devseed коммитит реальные строки не в rollback-транзакции — при параллельном
      # запуске пакетов это гонка с фикстурами internal/catalog/repo/postgres.
      - run: go test -tags=integration -p 1 ./...
        env:
          TEST_DATABASE_URL: postgres://eduhub:eduhub@localhost:5432/eduhub_test?sslmode=disable

      # Задача 30: миграции должны выживать полный цикл down/up уже с засеянными данными
      # (например неаккуратный DROP COLUMN/constraint при откате с непустой таблицей),
      # не только на пустой схеме.
      - name: Прогнать цикл миграций с dev-сидом (migrate-up → seed → migrate-down → migrate-up)
        run: |
          go tool goose -dir migrations postgres "$DATABASE_URL" up
          go run ./cmd/devseed
          go tool goose -dir migrations postgres "$DATABASE_URL" down
          go tool goose -dir migrations postgres "$DATABASE_URL" up
        env:
          APP_ENV: dev
          DATABASE_URL: postgres://eduhub:eduhub@localhost:5432/eduhub_test?sslmode=disable
          # cmd/devseed никогда не обращается к Redis/JWT — но config.Load() общий с cmd/api
          # и требует оба значения безусловно (задачи 31, E2.3), поэтому оба обязаны быть
          # непустыми здесь тоже, реальная связь/подпись не нужны.
          REDIS_ADDR: localhost:6379
          JWT_SECRET: ci-only-not-a-real-secret

      - run: go tool govulncheck ./...

      - run: docker build -t eduhub-api .