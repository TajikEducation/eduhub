services:
  # PostgreSQL + PostGIS. Порт на хосте 5433, чтобы не конфликтовать с
  # локально установленным PostgreSQL (порт по умолчанию 5432). Совпадает
  # с DATABASE_URL в .env.example.
  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: eduhub
      POSTGRES_PASSWORD: eduhub
      POSTGRES_DB: eduhub
    volumes:
      - eduhub-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduhub -d eduhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis. Порт на хосте 6380 — 6379 уже занят контейнером другого
  # локального проекта на этой машине; перемаплен во избежание конфликта.
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - eduhub-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO — S3-совместимое хранилище только для dev/test. В проде —
  # реальный S3-совместимый провайдер, настраивается отдельно (см. .env.example).
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: eduhub
      MINIO_ROOT_PASSWORD: eduhub12345
    volumes:
      - eduhub-miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Разовый прогон миграций перед стартом api — см. Makefile migrate-up для ручного запуска
  # вне докера (например, откат `migrate-down`).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    entrypoint:
      [
        "go", "tool", "goose",
        "-dir", "migrations",
        "postgres", "postgres://eduhub:eduhub@db:5432/eduhub?sslmode=disable",
        "up",
      ]
    volumes:
      - ./:/src
      - go-mod-cache:/root/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

  # Разовый прогон демо-сида после миграций — см. cmd/devseed, Makefile seed для ручного
  # запуска вне докера. Идемпотентен (upsert по seed_ref) — безопасно гонять на каждом старте.
  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    entrypoint: ["go", "run", "./cmd/devseed"]
    environment:
      APP_ENV: dev
      DATABASE_URL: postgres://eduhub:eduhub@db:5432/eduhub?sslmode=disable
      # cmd/devseed не обращается к Redis, но config.Load() общий с api и требует значение
      # безусловно (см. .github/workflows/ci.yml, тот же фикс).
      REDIS_ADDR: redis:6379
    volumes:
      - ./:/src
      - go-mod-cache:/root/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # API-сервис с hot-reload (air) — только для локальной разработки. Прод-образ: Dockerfile.
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      APP_ENV: dev
      HTTP_ADDR: :8080
      # Внутренний порт БД (5432) в докер-сети, не хостовый маппинг 5433.
      DATABASE_URL: postgres://eduhub:eduhub@db:5432/eduhub?sslmode=disable
      # Внутренний порт Redis (6379) в докер-сети, не хостовый маппинг 6380.
      REDIS_ADDR: redis:6379
      LOG_LEVEL: debug
      SHUTDOWN_TIMEOUT: 10s
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./:/src
      - go-mod-cache:/root/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

volumes:
  eduhub-pgdata:
  eduhub-redisdata:
  eduhub-miniodata:
  go-mod-cache:
  go-build-cache:
