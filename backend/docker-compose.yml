services:
  # PostgreSQL + PostGIS. Порт на хосте 5433, чтобы не конфликтовать с
  # локально установленным PostgreSQL (порт по умолчанию 5432). Совпадает
  # с DATABASE_URL в .env.example.
  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: eduhub
      POSTGRES_PASSWORD: eduhub
      POSTGRES_DB: eduhub
    volumes:
      - eduhub-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduhub -d eduhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis. Порт на хосте 6380 — 6379 уже занят контейнером другого
  # локального проекта на этой машине; перемаплен во избежание конфликта.
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - eduhub-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO — S3-совместимое хранилище только для dev/test. В проде —
  # реальный S3-совместимый провайдер, настраивается отдельно (см. .env.example).
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: eduhub
      MINIO_ROOT_PASSWORD: eduhub12345
    volumes:
      - eduhub-miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eduhub-pgdata:
  eduhub-redisdata:
  eduhub-miniodata:
